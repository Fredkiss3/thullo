name: Build and Push Thullo Images
on:
    # Triggers the workflow on push or pull request events but only for the main branch
    push:
        branches:
            - develop
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build-push-frontend:
        name: Build and Push Thullo Frontend
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            attestations: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Cache pnpm dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.pnpm-store
                  key: ${{ runner.OS }}-pnpm-cache-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.OS }}-pnpm-cache-
            - name: Build front with node
              run: |
                  curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@6
                  FORCE_COLOR=true pnpm install --prefix packages/front --shamefully-hoist --frozen-lockfile
                  FORCE_COLOR=true pnpm --prefix packages/front run build
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Log in to the Container registry
              uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.CONTAINER_REGISTRY_PAT }}
            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  file: Dockerfile.front
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ghcr.io/fredkiss3/thullo-front:latest,ghcr.io/fredkiss3/thullo-front:${{ github.sha }}
                  cache-from: type=registry,ref=ghcr.io/fredkiss3/thullo-front:latest
                  cache-to: type=inline
    build-push-backend:
        name: Build and Push Thullo API
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            attestations: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Log in to the Container registry
              uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.CONTAINER_REGISTRY_PAT }}
            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  file: Dockerfile.api
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ghcr.io/fredkiss3/thullo-api:latest,ghcr.io/fredkiss3/thullo-api:${{ github.sha }}
                  cache-from: |
                      type=registry,ref=ghcr.io/fredkiss3/thullo-api:latest
                  cache-to: type=inline
